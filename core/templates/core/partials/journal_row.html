<tr class="hover:bg-white/[0.03] transition-colors duration-200 group"
    id="row-{{ entry.id }}">

    <td class="py-5 px-6 align-middle">
        <div class="flex flex-col gap-0.5">
            <span class="text-xs font-bold font-mono text-slate-300">
                {{ entry.created_at|date:"M d" }}
            </span>
            <span class="text-[10px] font-medium text-slate-600 uppercase tracking-wider">
                {{ entry.created_at|date:"H:i" }} UTC
            </span>
        </div>
    </td>

    <td class="py-5 px-6 align-middle">
        <div class="flex flex-col gap-0.5">
            <span class="font-black text-white text-sm tracking-tight">
                {{ entry.symbol }}
            </span>
            <span class="text-[9px] font-bold text-slate-500 bg-white/5 px-1.5 py-0.5 rounded w-fit uppercase tracking-wider">
                {{ entry.leverage|default:"Low" }} Lev
            </span>
        </div>
    </td>

    <td class="py-5 px-6 align-middle">
        {% if entry.bias == 'LONG' %}
            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded bg-emerald-500/10 border border-emerald-500/20 text-[10px] font-bold text-emerald-400 uppercase tracking-wide">
                <i data-lucide="arrow-up" class="w-3 h-3"></i> Long
            </span>
        {% else %}
            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded bg-red-500/10 border border-red-500/20 text-[10px] font-bold text-red-400 uppercase tracking-wide">
                <i data-lucide="arrow-down" class="w-3 h-3"></i> Short
            </span>
        {% endif %}
    </td>

    <td class="py-5 px-6 align-middle text-right font-mono text-xs text-slate-400">{{ entry.entry_price }}</td>
    <td class="py-5 px-6 align-middle text-right font-mono text-xs font-bold text-emerald-500/80">{{ entry.target }}</td>
    <td class="py-5 px-6 align-middle text-right font-mono text-xs font-bold text-red-500/80">{{ entry.stop_loss }}</td>

    <td class="py-5 px-6 align-middle text-center">
        <span class="inline-flex justify-center w-24 py-1.5 rounded-md text-[10px] font-bold uppercase tracking-widest
            {% if entry.status == 'PENDING' %}bg-yellow-500/10 border border-yellow-500/20 text-yellow-500
            {% elif entry.status == 'WIN' %}bg-emerald-500/10 border border-emerald-500/20 text-emerald-400
            {% elif entry.status == 'LOSS' %}bg-red-500/10 border border-red-500/20 text-red-400
            {% else %}bg-slate-800 border border-slate-700 text-slate-400{% endif %}">
            {{ entry.status }}
        </span>
    </td>

    <td class="py-5 px-6 align-middle text-right">
        <div class="flex items-center justify-end gap-2 opacity-50 group-hover:opacity-100 transition">

            <button
                hx-post="{% url 'refresh_journal_entry' entry.id %}"
                hx-target="#row-{{ entry.id }}"
                hx-swap="outerHTML"
                class="p-2 rounded-lg text-slate-400 hover:text-violet-400 hover:bg-violet-500/20 transition"
                title="Sync Live Price">

                <i data-lucide="refresh-cw" class="w-4 h-4 rotate-while-loading"></i>
            </button>

            <button
                hx-delete="{% url 'delete_journal_entry' entry.id %}"
                hx-confirm="Delete this trade record permanently?"
                hx-target="#row-{{ entry.id }}"
                hx-swap="outerHTML"
                class="p-2 rounded-lg text-slate-400 hover:text-red-400 hover:bg-red-500/20 transition"
                title="Delete Record">

                <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>

        </div>
    </td>
</tr>
