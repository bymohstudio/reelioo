<div class="relative w-full overflow-hidden font-sans border-b border-white/5 bg-[#020617]"
     hx-get="{% url 'hx_ticker' %}"
     hx-trigger="every 60s"
     hx-swap="outerHTML">

    <div class="absolute left-0 top-0 bottom-0 w-12 sm:w-24 bg-gradient-to-r from-[#020617] to-transparent z-10 pointer-events-none"></div>
    <div class="absolute right-0 top-0 bottom-0 w-12 sm:w-24 bg-gradient-to-l from-[#020617] to-transparent z-10 pointer-events-none"></div>

    <div class="marquee-track flex items-center gap-12 py-3 whitespace-nowrap">
        {% for item in ticker %}
        <div class="flex items-center gap-3">
            <span class="text-slate-500 font-black text-[10px] uppercase tracking-widest">{{ item.symbol }}</span>
            <span class="font-mono font-bold text-xs tracking-tight
                {% if item.price == '---' %}text-slate-600{% else %}text-emerald-400{% endif %}">
                {{ item.price }}
            </span>
        </div>
        {% empty %}
        <div class="flex items-center gap-2 text-[10px] text-slate-600 uppercase tracking-widest pl-4">
            <i data-lucide="loader-2" class="w-3 h-3 animate-spin"></i> ESTABLISHING LIVE FEED...
        </div>
        {% endfor %}
    </div>
</div>

<style>
    @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
    .marquee-track { animation: marquee 120s linear infinite; }
    .marquee-track:hover { animation-play-state: paused; }
</style>
<script>
    if(window.lucide) lucide.createIcons();
</script>
