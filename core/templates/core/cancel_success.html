{% extends "core/base.html" %}

{% block content %}
<div class="fixed inset-0 bg-black/90 backdrop-blur-xl z-50 flex items-center justify-center p-4">
    <div class="bg-[#0a0a0a] border border-orange-500/20 rounded-2xl p-10 max-w-sm w-full text-center relative overflow-hidden shadow-[0_0_100px_rgba(249,115,22,0.15)] animate-scale-in">

        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-32 bg-orange-500/10 blur-[50px] rounded-full pointer-events-none"></div>

        <div class="w-20 h-20 bg-orange-500/10 rounded-full flex items-center justify-center mx-auto mb-6 border border-orange-500/20 relative">
            <i data-lucide="calendar-off" class="w-10 h-10 text-orange-400"></i>
        </div>

        <h2 class="text-2xl font-black text-white mb-2 tracking-tight">CANCELLATION SCHEDULED</h2>
        <p class="text-slate-400 text-xs font-mono mb-8">
            Your access remains active until the end of the billing cycle. You will not be charged again.
        </p>

        <div class="w-full bg-[#111] h-1.5 rounded-full overflow-hidden mb-2">
            <div class="h-full bg-orange-500/50 w-full animate-drain-bar"></div>
        </div>
        <p class="text-[9px] text-slate-500 font-mono uppercase tracking-widest">Updating Account...</p>
    </div>
</div>

<style>
    @keyframes scaleIn { 0% { opacity: 0; transform: scale(0.95); } 100% { opacity: 1; transform: scale(1); } }
    .animate-scale-in { animation: scaleIn 0.3s ease-out forwards; }
    @keyframes drainBar { 0% { width: 100%; } 100% { width: 0%; } }
    .animate-drain-bar { animation: drainBar 2.5s linear forwards; }
</style>

<script>
    if (window.lucide) lucide.createIcons();
    // Auto-Forward to Settings
    setTimeout(() => { window.location.href = "{% url 'settings' %}"; }, 2500);
</script>
{% endblock %}
