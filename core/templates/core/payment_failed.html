{% extends "core/base.html" %}

{% block content %}
<div class="fixed inset-0 bg-black/90 backdrop-blur-xl z-50 flex items-center justify-center p-4" x-data="{ loading: false }">
    <div class="bg-[#0a0a0a] border border-red-600/30 rounded-2xl p-10 max-w-sm w-full text-center relative overflow-hidden shadow-[0_0_100px_rgba(220,38,38,0.2)] animate-shake">

        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-32 bg-red-600/20 blur-[50px] rounded-full pointer-events-none"></div>

        <div class="w-20 h-20 bg-red-600/10 rounded-full flex items-center justify-center mx-auto mb-6 border border-red-600/20 relative">
            <div class="absolute inset-0 border border-red-500/50 rounded-full animate-ping opacity-20"></div>
            <i data-lucide="x-circle" class="w-10 h-10 text-red-500"></i>
        </div>

        <h2 class="text-2xl font-black text-white mb-2 tracking-tight">PAYMENT FAILED</h2>
        <p class="text-slate-400 text-xs font-mono mb-8">
            Connection could not be established.
        </p>

        <a href="{% url 'pricing' %}" @click="loading = true" class="block w-full py-3 bg-white text-black font-bold text-xs rounded-lg uppercase tracking-widest hover:bg-slate-200 transition flex items-center justify-center gap-2">
            <span x-show="!loading">TRY AGAIN</span>
            <span x-show="loading"><i data-lucide="loader-2" class="animate-spin w-4 h-4"></i></span>
        </a>
    </div>
</div>

<style>
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        10%, 30%, 50%, 70%, 90% { transform: translateX(-4px); }
        20%, 40%, 60%, 80% { transform: translateX(4px); }
    }
    .animate-shake { animation: shake 0.4s ease-in-out; }
</style>
{% endblock %}
