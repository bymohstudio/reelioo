{% extends "core/base.html" %}
{% block content %}
<div class="flex items-center justify-center min-h-[85vh] px-4 animate-fade-in relative overflow-hidden font-sans" x-data="{ loading: false }">

    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-violet-900/10 rounded-full blur-[100px] -z-10"></div>

    <div class="w-full max-w-md bg-[#0a0a0a] border border-white/10 rounded-2xl p-8 sm:p-10 shadow-2xl relative z-10">

        <div class="text-center mb-8">
            <h2 class="text-3xl font-black text-white mb-2">Terminal Access</h2>
            <p class="text-xs text-slate-500 uppercase tracking-widest">Enter Credentials to Unlock</p>
        </div>

        <form method="post" class="space-y-6" @submit="loading = true">
            {% csrf_token %}

            <div>
                <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Username / Handle</label>
                <input type="text" name="username" required
                       class="w-full bg-[#111] border border-white/10 rounded-lg px-4 py-3 text-white text-sm focus:border-violet-500 focus:outline-none focus:ring-1 focus:ring-violet-500 transition font-mono placeholder-slate-700"
                       placeholder="TraderName">
            </div>

            <div>
                <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Gumroad License Key</label>
                <input type="text" name="license_key" required
                       class="w-full bg-[#111] border border-white/10 rounded-lg px-4 py-3 text-white text-sm focus:border-violet-500 focus:outline-none focus:ring-1 focus:ring-violet-500 transition font-mono placeholder-slate-700"
                       placeholder="XXXX-XXXX-XXXX-XXXX">
                <p class="mt-2 text-[10px] text-slate-600">
                    Don't have a key? <a href="https://gumroad.com/l/reelioo-pro" target="_blank" class="text-violet-400 hover:text-white underline">Get one here (14-Day Free Trial)</a>
                </p>
            </div>

            <button type="submit" :disabled="loading"
                    class="w-full bg-violet-600 hover:bg-violet-500 text-white font-bold py-4 rounded-lg shadow-lg transition-all transform active:scale-[0.98] text-xs uppercase tracking-widest flex items-center justify-center gap-2">
                <span x-show="!loading">INITIALIZE SESSION</span>
                <span x-show="loading"><i data-lucide="loader-2" class="animate-spin w-4 h-4"></i> VERIFYING...</span>
            </button>
        </form>

    </div>
</div>
{% endblock %}
