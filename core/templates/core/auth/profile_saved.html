{% extends "core/base.html" %}

{% block content %}
<div class="fixed inset-0 bg-black/90 backdrop-blur-xl z-50 flex items-center justify-center p-4"
     x-data x-init="setTimeout(() => window.location.href = '{% url 'settings' %}', 1500)">

    <div class="bg-[#0a0a0a] border border-blue-500/30 rounded-2xl p-10 max-w-sm w-full text-center relative overflow-hidden shadow-[0_0_100px_rgba(59,130,246,0.2)] animate-scale-in">

        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-32 bg-blue-500/20 blur-[50px] rounded-full pointer-events-none"></div>

        <div class="w-20 h-20 bg-blue-500/10 rounded-full flex items-center justify-center mx-auto mb-6 border border-blue-500/20 relative">
            <div class="absolute inset-0 border border-blue-500/50 rounded-full animate-ping opacity-20"></div>
            <i data-lucide="user-check" class="w-10 h-10 text-blue-400"></i>
        </div>

        <h2 class="text-2xl font-black text-white mb-2 tracking-tight">PROFILE SAVED</h2>
        <p class="text-slate-400 text-xs font-mono mb-8">Saving your preferences...</p>

        <div class="w-full bg-[#111] h-1.5 rounded-full overflow-hidden mb-2">
            <div class="h-full bg-blue-500 w-0 animate-fill-bar"></div>
        </div>
        <p class="text-[9px] text-slate-500 font-mono uppercase tracking-widest">Redirecting...</p>
    </div>
</div>

<style>
    @keyframes scaleIn { 0% { opacity: 0; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1); } }
    .animate-scale-in { animation: scaleIn 0.3s ease-out forwards; }
    @keyframes fillBar { 0% { width: 0%; } 100% { width: 100%; } }
    .animate-fill-bar { animation: fillBar 1.5s linear forwards; }
</style>
{% endblock %}
