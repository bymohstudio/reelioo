{% extends "core/base.html" %}
{% block content %}
<div class="flex items-center justify-center min-h-[85vh] px-4 animate-fade-in relative overflow-hidden font-sans">

    <!-- Ambient Glow -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2
                w-[600px] h-[600px] bg-blue-900/10 rounded-full blur-[100px] -z-10"></div>

    <div class="w-full max-w-md bg-[#0a0a0a] border border-white/10
                rounded-2xl p-8 sm:p-10 shadow-2xl relative z-10">

        <!-- Header -->
        <div class="text-center mb-8">
            <h2 class="text-3xl font-black text-white mb-2">
                Create Your Reelioo Account
            </h2>
            <p class="text-xs text-slate-500 uppercase tracking-widest">
                21-Day Free Trial · No Credit Card Required
            </p>
        </div>

        <!-- Form -->
        <form method="post" class="space-y-5">
            {% csrf_token %}

            <!-- Email -->
            <div>
                <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">
                    Email Address
                </label>
                <input type="email" name="email" required
                       placeholder="you@email.com"
                       class="w-full bg-[#111] border border-white/10 rounded-lg
                              px-4 py-3 text-white text-sm
                              focus:border-blue-500 focus:outline-none
                              focus:ring-1 focus:ring-blue-500 transition
                              shadow-inner placeholder-slate-700 font-mono">
            </div>

            <!-- Password -->
            <div>
                <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">
                    Password
                </label>
                <input type="password" name="password" required
                       placeholder="••••••••"
                       class="w-full bg-[#111] border border-white/10 rounded-lg
                              px-4 py-3 text-white text-sm
                              focus:border-blue-500 focus:outline-none
                              focus:ring-1 focus:ring-blue-500 transition
                              shadow-inner placeholder-slate-700">
                <p class="mt-1 text-[10px] text-slate-600">
                    Use at least 8 characters
                </p>
            </div>

            <!-- CTA -->
            <button type="submit"
                    class="w-full bg-gradient-to-r from-blue-600 to-blue-500
                           hover:from-blue-500 hover:to-blue-400
                           text-white font-bold py-4 rounded-lg
                           shadow-lg transition-all
                           transform active:scale-[0.98]
                           text-xs uppercase tracking-widest">
                Start 21-Day Free Trial
            </button>

            <!-- Trust -->
            <p class="text-[10px] text-slate-600 text-center">
                No credit card required · Cancel anytime
            </p>
        </form>

        <!-- Footer -->
        <div class="mt-8 pt-6 border-t border-white/5 text-center">
            <p class="text-xs text-slate-500">
                Already have an account?
                <a href="{% url 'login' %}"
                   class="text-blue-400 hover:text-white transition font-bold">
                    Login here
                </a>
            </p>
        </div>

    </div>
</div>
{% endblock %}
