{% extends "core/base.html" %}
{% block content %}
<div class="flex items-center justify-center min-h-[85vh] px-4 animate-fade-in relative overflow-hidden font-sans" x-data="{ loading: false }">
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-blue-900/10 rounded-full blur-[100px] -z-10"></div>

    <div class="w-full max-w-md bg-[#0a0a0a] border border-white/10 rounded-2xl p-8 sm:p-10 shadow-2xl relative z-10">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-black text-white mb-2">Welcome Back to Reelioo</h2>
            <p class="text-xs text-slate-500 uppercase tracking-widest">Secure Access · Quant Intelligence</p>
        </div>

        <form method="post" class="space-y-6" @submit="loading = true">
            {% csrf_token %}
            <div><label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Email Address</label><input type="email" name="email" required class="w-full bg-[#111] border border-white/10 rounded-lg px-4 py-3 text-white text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500 transition shadow-inner placeholder-slate-700 font-mono" placeholder="you@email.com"></div>
            <div><label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Password</label><input type="password" name="password" required class="w-full bg-[#111] border border-white/10 rounded-lg px-4 py-3 text-white text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500 transition shadow-inner placeholder-slate-700" placeholder="••••••••"></div>

            <button type="submit" :disabled="loading" class="w-full bg-blue-500 text-black font-bold py-4 rounded-lg shadow-[0_0_20px_rgba(255,255,255,0.1)] hover:bg-blue-400 transition-all transform active:scale-[0.98] text-xs uppercase tracking-widest flex items-center justify-center gap-2">
                <span x-show="!loading">Sign In</span>
                <span x-show="loading"><i data-lucide="loader-2" class="animate-spin w-4 h-4"></i></span>
            </button>
        </form>
        <div class="mt-8 pt-6 border-t border-white/5 text-center"><p class="text-xs text-slate-500">New here? <a href="{% url 'signup' %}" class="text-blue-400 hover:text-white transition font-bold">Start your 21-day free trial</a></p></div>
    </div>
</div>
{% endblock %}
