{% extends "core/base.html" %}

{% block content %}
<div class="min-h-screen bg-[#020617] text-slate-300 selection:bg-blue-500/30 overflow-x-hidden relative"
     x-data="{
        symbol: '',
        mode: 'INTRADAY',
        suggestions: [],
        allSymbols: ['BTCUSDT', 'ETHUSDT', 'SOLUSDT', 'BNBUSDT', 'XRPUSDT', 'DOGEUSDT', 'AVAXUSDT'],
        showAlpha: false
     }"
     x-init="
        fetch('/api/symbols/').then(r => r.json()).then(data => { if(Array.isArray(data)) allSymbols = data; });
        $el.addEventListener('mode-change', (e) => { mode = e.detail; });
     ">

    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[1000px] h-[600px] bg-blue-600/5 rounded-full blur-[120px] pointer-events-none z-0"></div>

    <div class="relative z-30 w-full border-b border-white/5 bg-[#0b1121]/80 backdrop-blur-md"
         hx-get="{% url 'hx_ticker' %}"
         hx-trigger="load">
         <div class="h-12 flex items-center justify-center"><div class="w-4 h-4 border-2 border-slate-600 border-t-blue-500 rounded-full animate-spin"></div></div>
    </div>

    <div class="relative z-10 max-w-[1400px] mx-auto px-4 py-6">

        <div class="glass-panel min-h-[750px] flex flex-col relative z-20 shadow-2xl animate-fade-in-up">
            <div class="bg-[#0b1121]/90 backdrop-blur-xl rounded-[20px] h-full w-full p-4 md:p-6 border border-white/5 flex flex-col">

                <div class="flex flex-col xl:flex-row justify-between items-start xl:items-center mb-6 gap-6 border-b border-white/5 pb-6">

                    <div class="flex flex-col sm:flex-row items-start sm:items-center gap-6">
                        <div class="flex gap-2 bg-[#020617] p-1 rounded-xl border border-white/5">
                            <button @click="mode='INTRADAY'; $dispatch('mode-change', 'INTRADAY')"
                                    :class="mode==='INTRADAY' ? 'bg-[#1e293b] text-white shadow-lg' : 'text-slate-500 hover:text-white'"
                                    class="px-5 py-2.5 rounded-lg text-[11px] font-black uppercase tracking-widest transition-all duration-200">
                                Intraday
                            </button>
                            <button @click="mode='SCALP'; $dispatch('mode-change', 'SCALP')"
                                    :class="mode==='SCALP' ? 'bg-blue-600 text-white shadow-lg shadow-blue-900/30' : 'text-slate-500 hover:text-white'"
                                    class="px-5 py-2.5 rounded-lg text-[11px] font-black uppercase tracking-widest transition-all duration-200">
                                Scalp
                            </button>
                        </div>

                        <div class="relative group">
                            <button @click="showAlpha = true"
                                    hx-get="{% url 'hx_alpha_scan' %}"
                                    hx-target="#alpha-content"
                                    hx-indicator="#alpha-loader"
                                    class="px-6 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-black text-[10px] uppercase tracking-widest shadow-[0_0_20px_rgba(37,99,235,0.3)] hover:shadow-[0_0_30px_rgba(37,99,235,0.5)] transition-all transform hover:-translate-y-0.5 border border-white/20 flex items-center gap-2">
                                <i data-lucide="crosshair" class="w-4 h-4 text-white/70"></i>
                                <span>Find Alpha</span>
                            </button>
                            <div class="absolute top-full left-0 mt-2 w-full opacity-0 group-hover:opacity-100 transition duration-500 pointer-events-none">
                                <p class="text-[8px] text-slate-500 font-bold uppercase tracking-widest leading-tight whitespace-nowrap">
                                    USE 'ALPHA' TO SCAN<br>15+ PAIRS FOR EDGE
                                </p>
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center gap-3 bg-[#020617]/50 px-4 py-2 rounded-full border border-white/5">
                        <span class="relative flex h-2 w-2">
                          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
                          <span class="relative inline-flex rounded-full h-2 w-2 bg-blue-500"></span>
                        </span>
                        <span class="text-[10px] font-black text-slate-300 uppercase tracking-widest">Quant Engine Online</span>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 h-full">

                    <div class="lg:col-span-4 space-y-6">
                        <form hx-post="{% url 'hx_analyze' %}"
                              hx-target="#results-view"
                              hx-indicator="#loading-view"
                              x-ref="scanForm"
                              @submit.prevent="$el.requestSubmit()"
                              class="space-y-6">

                            <div class="relative group">
                                <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2 block">Target Asset</label>
                                <div class="flex items-center gap-4 bg-[#020617] border border-slate-700 rounded-xl px-5 py-5 focus-within:border-blue-500 transition shadow-inner">
                                    <i data-lucide="search" class="w-5 h-5 text-slate-500 group-focus-within:text-blue-500 transition"></i>
                                    <input type="text" name="symbol" x-model="symbol"
                                           @input="if(symbol.length < 1) suggestions=[]; else suggestions = allSymbols.filter(s => s.includes(symbol.toUpperCase())).slice(0, 5)"
                                           class="bg-transparent border-none text-white w-full outline-none font-mono text-xl uppercase font-black placeholder-slate-700"
                                           placeholder="BTC..." autocomplete="off">
                                </div>

                                <div x-show="suggestions.length > 0"
                                     @click.outside="suggestions = []"
                                     class="absolute top-full left-0 right-0 mt-2 bg-[#0f172a] border border-slate-700 rounded-xl z-50 shadow-2xl overflow-hidden max-h-60 overflow-y-auto custom-scrollbar"
                                     x-cloak x-transition>
                                    <template x-for="s in suggestions">
                                        <div @click="symbol = s; suggestions = []; $nextTick(() => $refs.scanForm.requestSubmit())"
                                             class="px-5 py-4 hover:bg-slate-800 cursor-pointer border-b border-white/5 last:border-0 flex justify-between items-center transition">
                                            <span class="text-sm font-bold text-white" x-text="s"></span>
                                            <span class="text-[9px] text-slate-500 font-mono font-bold">PERP</span>
                                        </div>
                                    </template>
                                </div>
                            </div>

                            <input type="hidden" name="mode" x-model="mode">

                            <button type="submit" class="w-full py-5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-black text-xs uppercase tracking-[0.2em] shadow-lg shadow-blue-900/20 transition-all transform active:scale-[0.98] border border-white/10 flex items-center justify-center gap-3">
                                <i data-lucide="zap" class="w-4 h-4"></i> Run Reelioo Scan
                            </button>
                        </form>

                        <button hx-post="{% url 'hx_backtest' %}"
                                hx-target="#backtest-content"
                                hx-include="[name='symbol'], [name='mode']"
                                onclick="document.getElementById('backtest-modal').classList.remove('hidden')"
                                class="w-full py-4 rounded-xl border border-slate-700 bg-[#020617] text-slate-400 hover:text-white hover:border-slate-500 transition font-bold text-[10px] uppercase tracking-widest flex items-center justify-center gap-2">
                            <i data-lucide="history" class="w-4 h-4"></i> Run Historical Simulation
                        </button>

                        <div class="pt-6 border-t border-white/5">
                            <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-4 block">Market Radar</label>
                            <div class="grid grid-cols-2 gap-3">
                                <button type="button" @click="symbol='BTCUSDT'; $nextTick(() => $refs.scanForm.requestSubmit())" class="flex items-center gap-3 p-4 rounded-xl bg-[#0f172a] border border-slate-800 hover:border-orange-500/50 transition group text-left w-full">
                                    <div class="w-10 h-10 rounded-lg bg-orange-500/10 flex items-center justify-center text-orange-500"><i data-lucide="bitcoin" class="w-5 h-5"></i></div>
                                    <div><div class="text-sm font-black text-white">BTC</div><div class="text-[9px] font-bold text-slate-500 group-hover:text-orange-400">LEADER</div></div>
                                </button>
                                <button type="button" @click="symbol='ETHUSDT'; $nextTick(() => $refs.scanForm.requestSubmit())" class="flex items-center gap-3 p-4 rounded-xl bg-[#0f172a] border border-slate-800 hover:border-blue-500/50 transition group text-left w-full">
                                    <div class="w-10 h-10 rounded-lg bg-blue-500/10 flex items-center justify-center text-blue-500"><i data-lucide="layers" class="w-5 h-5"></i></div>
                                    <div><div class="text-sm font-black text-white">ETH</div><div class="text-[9px] font-bold text-slate-500 group-hover:text-blue-400">SMART</div></div>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="lg:col-span-8 min-h-[600px] bg-[#020617] rounded-2xl border border-slate-800 relative overflow-hidden flex flex-col shadow-inner">

                        <div id="results-view" class="h-full">
                            <div class="absolute inset-0 flex flex-col items-center justify-center text-slate-600">
                                <i data-lucide="activity" class="w-20 h-20 opacity-60 mb-6"></i>
                                <p class="text-xs font-black tracking-[0.3em] opacity-70 uppercase">System Ready</p>
                            </div>
                        </div>

                        <div id="loading-view" class="htmx-indicator absolute inset-0 z-50 flex flex-col items-center justify-center bg-[#020617]">
                            <div class="w-16 h-16 border-2 border-slate-800 border-t-blue-500 rounded-full animate-spin mb-6"></div>
                            <p class="text-[10px] font-bold font-mono text-blue-400 animate-pulse tracking-widest">CALCULATING VECTORS...</p>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <div x-show="showAlpha" x-cloak
         class="fixed inset-0 z-[100] bg-[#020617]/95 backdrop-blur-2xl flex items-center justify-center p-4"
         x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
         x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-95">

        <div class="w-full max-w-md bg-[#0b1121] border border-white/10 rounded-3xl shadow-[0_0_100px_rgba(59,130,246,0.1)] relative overflow-hidden"
             @click.outside="showAlpha = false">
            <button @click="showAlpha = false" class="absolute top-6 right-6 text-slate-500 hover:text-white transition"><i data-lucide="x" class="w-6 h-6"></i></button>
            <div id="alpha-loader" class="htmx-indicator flex flex-col items-center justify-center py-32">
                <div class="w-16 h-16 border-4 border-slate-800 border-t-blue-500 rounded-full animate-spin mb-8"></div>
                <p class="text-xs font-black text-blue-500 animate-pulse tracking-[0.3em] uppercase">Scanning Global Vectors...</p>
            </div>
            <div id="alpha-content"></div>
        </div>
    </div>

    <div id="backtest-modal" class="hidden fixed inset-0 z-[100] bg-black/90 backdrop-blur-xl flex items-center justify-center p-4">
        <div class="w-full max-w-2xl bg-[#0f172a] border border-slate-700 rounded-2xl shadow-2xl relative overflow-hidden flex flex-col max-h-[80vh]">
            <div class="p-4 border-b border-white/5 flex justify-between items-center bg-white/5">
                <h3 class="text-sm font-black text-white uppercase tracking-widest">Strategy Report</h3>
                <button onclick="document.getElementById('backtest-modal').classList.add('hidden')" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div id="backtest-content" class="flex-grow overflow-y-auto p-6 flex flex-col items-center justify-center min-h-[300px]">
                <p class="text-xs font-mono text-slate-500 animate-pulse font-bold">INITIALIZING SIMULATION...</p>
            </div>
        </div>
    </div>
</div>

<style>
    .glass-panel { background: rgba(15, 23, 42, 0.4); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 24px; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.05); }
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: flex; }
    .htmx-request.htmx-indicator { display: flex; }
    [x-cloak] { display: none !important; }
</style>
{% endblock %}
